<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>当日时间进度条 + 番茄钟</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system}
body {
    background:transparent;
    padding:12px;
}
/*=====当日时间进度条样式，灰度突出卡片=====*/
.time-card{
    max-width:100%;
    background:rgba(245, 245, 245, 0.92);
    padding:18px;
    border-radius:20px;
    box-shadow:0 6px 24px rgba(0, 0, 0, 0.18);
    margin-bottom:20px;
    filter:grayscale(0.35);
}
.info-text{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
    font-size:18px;
    color:#333;
}
.progress-wrap{
    width:100%;
    height:20px;
    background:#e9ecef;
    border-radius:999px;
    position:relative;
    overflow:visible;
}
.progress-bar{
    height:100%;
    border-radius:inherit;
    transition:0.4s width ease;
}
.marker-icon{
    position:absolute;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:22px;
    transition:left 0.4s ease;
}

/*=====番茄钟样式，透明融入Notion=====*/
.wrap{
    text-align:center;
    width:220px;
    margin:0 auto;
    background:transparent;
    padding-top:4px;
}
.circle-wrap{
  position:relative;
  width:170px;height:170px;
  margin:0 auto 12px;
}
svg{width:100%;height:100%;transform:rotate(-90deg)}
.bg{fill:none;stroke:#eee;stroke-width:10}
.progress{fill:none;stroke:#ff6358;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 0.3s linear}
.time-text{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:32px;
  font-weight:500;
}
.mode{font-size:14px;color:#777;margin-bottom:10px}
.btn-group{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
button{
  padding:7px 12px;
  border-radius:8px;
  border:none;
  background:#efefef;
  cursor:pointer;
  font-size:13px;
}
button.primary{background:#ff6358;color:white}
button:hover{opacity:0.85}
</style>
</head>
<body>
    <!--当日时间进度条模块-->
    <div class="time-card">
        <div class="info-text">
            <span id="currentTime"></span>
            <span id="percentText"></span>
        </div>
        <div class="progress-wrap">
            <div class="progress-bar" id="bar"></div>
            <span class="marker-icon" id="marker"></span>
        </div>
    </div>

    <!--番茄钟模块-->
    <div class="wrap">
      <div class="circle-wrap">
        <svg viewBox="0 0 100 100">
          <circle class="bg" cx="50" cy="50" r="44"></circle>
          <circle class="progress" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"></circle>
        </svg>
        <div class="time-text" id="time">25:00</div>
      </div>
      <div class="mode" id="mode">🍅 工作 25min</div>
      <div class="btn-group">
        <button id="start">开始</button>
        <button id="reset">重置</button>
        <button id="switch">切换休息</button>
      </div>
    </div>

<script>
//当日时间进度JS
function updateTimeProgress(){
    const now=new Date();
    let hours=now.getHours();
    let minutes=now.getMinutes();
    let seconds=now.getSeconds();

    const totalDaySec=24*60*60;
    const passedSec=hours*3600+minutes*60+seconds;
    const pct=(passedSec/totalDaySec)*100;

    let markerEmoji="";
    let gradient="";

    if(hours >=5 && hours <=11){
        markerEmoji="☀️";
        gradient="linear-gradient(90deg,#ffd166,#ffb344)";
    }else if(hours>=12 && hours <=17){
        markerEmoji="🌅";
        gradient="linear-gradient(90deg,#fb8500,#e63946)";
    }else{
        markerEmoji="🌙";
        gradient="linear-gradient(90deg,#457b9d,#1d3557)";
    }

    const timeStr=`${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
    document.getElementById("currentTime").innerText=timeStr;
    document.getElementById("percentText").innerText=`今日已度过 ${pct.toFixed(1)}%`;

    const bar=document.getElementById("bar");
    bar.style.width=pct+"%";
    bar.style.background=gradient;

    const marker=document.getElementById("marker");
    marker.style.left=pct+"%";
    marker.innerText=markerEmoji;
}
updateTimeProgress();
setInterval(updateTimeProgress,1000);

//番茄钟JS
const CIRCLE_LEN = 2 * Math.PI * 44;
const elTime = document.getElementById('time');
const elMode = document.getElementById('mode');
const elProgress = document.querySelector('.progress');
const btnStart = document.getElementById('start');
const btnReset = document.getElementById('reset');
const btnSwitch = document.getElementById('switch');

let workSec = 25 * 60;
let restSec = 5 * 60;
let totalSec = workSec;
let remainSec = totalSec;
let isRunning = false;
let isWorkMode = true;
let timerId = null;
let originTitle = document.title;

function playBeep(){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);gain.connect(ctx.destination);
  osc.type='sine';osc.frequency.value=880;
  gain.gain.value=0.2;
  osc.start();osc.stop(ctx.currentTime+0.6);
}

function format(s){
  const m = Math.floor(s/60);
  const ss = String(s%60).padStart(2,'0');
  return `${m}:${ss}`;
}

function render(){
  elTime.innerText = format(remainSec);
  const offset = CIRCLE_LEN * (1 - remainSec / totalSec);
  elProgress.style.strokeDashoffset = offset;
  if(isRunning){
    document.title = `(${format(remainSec)}) ${originTitle}`;
  }else{
    document.title = originTitle;
  }
}

function tick(){
  remainSec--;
  render();
  if(remainSec <= 0){
    clearInterval(timerId);
    isRunning = false;
    btnStart.innerText = "开始";
    playBeep();
  }
}

btnStart.onclick = ()=>{
  if(isRunning){
    clearInterval(timerId);
    isRunning = false;
    btnStart.innerText = "继续";
  }else{
    isRunning = true;
    btnStart.innerText = "暂停";
    timerId = setInterval(tick, 1000);
  }
};

btnReset.onclick = ()=>{
  clearInterval(timerId);
  isRunning = false;
  remainSec = totalSec;
  btnStart.innerText = "开始";
  render();
};

btnSwitch.onclick = ()=>{
  clearInterval(timerId);
  isRunning = false;
  btnStart.innerText = "开始";
  isWorkMode = !isWorkMode;
  if(isWorkMode){
    totalSec = workSec;
    elMode.innerText = "🍅 工作 25min";
    elProgress.style.stroke = "#ff6358";
  }else{
    totalSec = restSec;
    elMode.innerText = "☕ 短休息 5min";
    elProgress.style.stroke = "#4299e1";
  }
  remainSec = totalSec;
  render();
};

render();
</script>
</body>
</html>
