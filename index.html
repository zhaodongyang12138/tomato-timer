<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>番茄钟</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system}
body{
  background:#ffffff;
  color:#222;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:340px;
  padding:16px;
}
.wrap{text-align:center;width:260px;}
.circle-wrap{
  position:relative;
  width:200px;height:200px;
  margin:0 auto 16px;
}
svg{width:100%;height:100%;transform:rotate(-90deg)}
.bg{fill:none;stroke:#eee;stroke-width:12}
.progress{fill:none;stroke:#ff6358;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 0.3s linear}
.time-text{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:36px;
  font-weight:500;
}
.mode{font-size:14px;color:#777;margin-bottom:12px}
.btn-group{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{
  padding:8px 14px;
  border-radius:8px;
  border:none;
  background:#efefef;
  cursor:pointer;
  font-size:14px;
}
button.primary{background:#ff6358;color:white}
button:hover{opacity:0.85}
</style>
</head>
<body>
<div class="wrap">
  <div class="circle-wrap">
    <svg viewBox="0 0 100 100">
      <circle class="bg" cx="50" cy="50" r="44"></circle>
      <circle class="progress" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"></circle>
    </svg>
    <div class="time-text" id="time">25:00</div>
  </div>
  <div class="mode" id="mode">🍅 工作 25min</div>
  <div class="btn-group">
    <button id="start">开始</button>
    <button id="reset">重置</button>
    <button id="switch">切换休息</button>
  </div>
</div>

<script>
const CIRCLE_LEN = 2 * Math.PI * 44;
const elTime = document.getElementById('time');
const elMode = document.getElementById('mode');
const elProgress = document.querySelector('.progress');
const btnStart = document.getElementById('start');
const btnReset = document.getElementById('reset');
const btnSwitch = document.getElementById('switch');

let workSec = 25 * 60;
let restSec = 5 * 60;
let totalSec = workSec;
let remainSec = totalSec;
let isRunning = false;
let isWorkMode = true;
let timerId = null;
let originTitle = document.title;

function playBeep(){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);gain.connect(ctx.destination);
  osc.type='sine';osc.frequency.value=880;
  gain.gain.value=0.2;
  osc.start();osc.stop(ctx.currentTime+0.6);
}

function format(s){
  const m = Math.floor(s/60);
  const ss = String(s%60).padStart(2,'0');
  return `${m}:${ss}`;
}

function render(){
  elTime.innerText = format(remainSec);
  const offset = CIRCLE_LEN * (1 - remainSec / totalSec);
  elProgress.style.strokeDashoffset = offset;
  if(isRunning){
    document.title = `(${format(remainSec)}) ${originTitle}`;
  }else{
    document.title = originTitle;
  }
}

function tick(){
  remainSec--;
  render();
  if(remainSec <= 0){
    clearInterval(timerId);
    isRunning = false;
    btnStart.innerText = "开始";
    playBeep();
  }
}

btnStart.onclick = ()=>{
  if(isRunning){
    clearInterval(timerId);
    isRunning = false;
    btnStart.innerText = "继续";
  }else{
    isRunning = true;
    btnStart.innerText = "暂停";
    timerId = setInterval(tick, 1000);
  }
};

btnReset.onclick = ()=>{
  clearInterval(timerId);
  isRunning = false;
  remainSec = totalSec;
  btnStart.innerText = "开始";
  render();
};

btnSwitch.onclick = ()=>{
  clearInterval(timerId);
  isRunning = false;
  btnStart.innerText = "开始";
  isWorkMode = !isWorkMode;
  if(isWorkMode){
    totalSec = workSec;
    elMode.innerText = "🍅 工作 25min";
    elProgress.style.stroke = "#ff6358";
  }else{
    totalSec = restSec;
    elMode.innerText = "☕ 短休息 5min";
    elProgress.style.stroke = "#4299e1";
  }
  remainSec = totalSec;
  render();
};

render();
</script>
</body>
</html>
